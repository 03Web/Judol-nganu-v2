<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Gates of Nganu - Cascade Effect</title>
    <style>
      /* --- CSS: TAMPILAN & ANIMASI --- */
      @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Roboto:wght@500&display=swap");

      :root {
        --gold: #ffd700;
        --gold-glow: #ffeb3b;
        --bg-dark: #2a0a38;
      }
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        color: white;
        font-family: "Roboto", sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .world-bg {
        position: absolute;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, #4a1060 0%, #150020 80%);
        z-index: -1;
      }

      /* Layout Utama */
      .main-interface {
        display: flex;
        width: 98%;
        max-width: 1200px;
        height: 85vh;
        gap: 10px;
        align-items: center;
        justify-content: center;
      }

      .side-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .logo-area h1 {
        font-family: "Cinzel", serif;
        font-size: 1.8rem;
        text-align: center;
        text-shadow: 0 0 10px var(--gold);
        line-height: 1.2;
        margin: 0;
      }
      .highlight {
        color: var(--gold);
        font-size: 2.2rem;
      }

      /* ZEUS */
      .zeus-avatar {
        width: 140px;
        height: 140px;
        background: radial-gradient(circle at 30% 30%, #fff, #e0e0e0);
        border-radius: 50%;
        border: 4px solid var(--gold);
        box-shadow: 0 0 30px var(--gold-glow);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 4rem;
        position: relative;
        z-index: 2;
        transition: transform 0.2s;
      }
      .zeus-body {
        width: 100px;
        height: 80px;
        background: linear-gradient(to bottom, #fff, #bbb);
        border-radius: 40% 40% 0 0;
        margin-top: -20px;
        z-index: 1;
        opacity: 0.8;
      }
      .zeus-strike .zeus-avatar {
        box-shadow: 0 0 50px cyan, 0 0 80px white;
        animation: shakeZeus 0.5s ease-in-out;
      }

      /* GRID GAME */
      .game-area {
        flex: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 600px;
      }

      .top-bar {
        background: rgba(0, 0, 0, 0.6);
        padding: 5px 20px;
        border-radius: 10px;
        border: 1px solid var(--gold);
        text-align: center;
        margin-bottom: 10px;
        min-width: 200px;
      }

      .slot-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        grid-template-rows: repeat(5, 1fr);
        gap: 5px;
        width: 100%;
        aspect-ratio: 6/5;
        background: rgba(0, 0, 0, 0.6);
        border: 4px solid var(--gold);
        border-radius: 15px;
        padding: 8px;
        box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        position: relative;
      }

      .grid-cell {
        background: linear-gradient(145deg, #2b1d36, #1a0f24);
        border: 1px solid #4a3b5a;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.8rem;
        position: relative;
        transition: transform 0.1s;
      }

      /* --- ANIMASI RUNTUHAN SATU PER SATU --- */

      /* 1. Efek Jatuh Membal (Gravity) */
      .anim-drop {
        animation: bounceIn 0.6s cubic-bezier(0.215, 0.61, 0.355, 1) forwards;
      }
      @keyframes bounceIn {
        0% {
          opacity: 0;
          transform: translateY(-300px);
        }
        60% {
          opacity: 1;
          transform: translateY(25px);
        }
        75% {
          transform: translateY(-10px);
        }
        90% {
          transform: translateY(5px);
        }
        100% {
          transform: translateY(0);
        }
      }

      /* 2. Efek Pecah (Explode) */
      .anim-explode {
        animation: implode 0.3s forwards ease-in;
        z-index: 10;
      }
      @keyframes implode {
        0% {
          transform: scale(1);
          filter: brightness(2);
        }
        50% {
          transform: scale(1.2);
          opacity: 1;
        }
        100% {
          transform: scale(0);
          opacity: 0;
        }
      }

      /* 3. Efek Highlight Menang */
      .anim-win-border {
        border: 2px solid white !important;
        box-shadow: 0 0 15px white, inset 0 0 10px gold;
        z-index: 5;
      }

      /* CONTROL BAR */
      .control-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.95);
        border-top: 2px solid #333;
        padding: 10px 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 100;
      }
      .info-group {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .label {
        font-size: 0.7rem;
        color: #aaa;
      }
      .val-box {
        display: flex;
        align-items: center;
        gap: 8px;
        color: white;
        font-weight: bold;
        font-family: monospace;
        font-size: 1.1rem;
      }

      .btn-tiny {
        background: #333;
        border: 1px solid #555;
        color: white;
        width: 25px;
        height: 25px;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .btn-add {
        background: #1b5e20;
        border-color: #2e7d32;
      }

      .spin-button {
        background: radial-gradient(circle, #ffeb3b, #f57f17);
        width: 70px;
        height: 70px;
        border-radius: 50%;
        border: 4px solid #fff59d;
        font-size: 1.5rem;
        font-weight: 900;
        color: #3e2723;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
      }
      .spin-disabled {
        filter: grayscale(1);
        cursor: not-allowed;
      }

      /* Multiplier Orb */
      .multiplier-orb {
        border-radius: 50%;
        width: 80%;
        height: 80%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: 900;
        font-size: 1rem;
        color: white;
        border: 2px solid white;
        box-shadow: 0 0 10px currentColor;
        animation: spinOrb 3s infinite linear;
      }
      @keyframes spinOrb {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .orb-green {
        background: #00c853;
        color: #b9f6ca;
      }
      .orb-red {
        background: #d50000;
        color: #ff8a80;
      }
      .orb-purple {
        background: #aa00ff;
        color: #ea80fc;
      }

      /* MODAL */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        z-index: 200;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(5px);
      }
      .modal-box {
        background: #1a0000;
        border: 2px solid var(--gold);
        padding: 20px;
        border-radius: 10px;
        width: 300px;
        text-align: center;
        color: white;
        box-shadow: 0 0 20px var(--gold);
      }
      .modal-btn {
        background: #333;
        color: white;
        padding: 10px;
        margin: 5px;
        border: 1px solid #555;
        cursor: pointer;
        width: 100%;
        border-radius: 5px;
      }

      /* ADMIN TRIGGER (GEAR) */
      .admin-trigger {
        position: fixed;
        bottom: 85px;
        right: 20px;
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.5);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        cursor: pointer;
        border: 1px dashed #555;
        z-index: 101;
      }
      .admin-trigger:hover {
        background: rgba(255, 255, 255, 0.3);
        color: white;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .side-panel {
          display: none;
        }
        .game-area {
          width: 100%;
          margin-bottom: 80px;
        }
      }
    </style>
  </head>
  <body>
    <div class="world-bg"></div>

    <div class="main-interface">
      <div class="side-panel">
        <div class="logo-area">
          <h1>GATES OF<br /><span class="highlight">Nganu</span></h1>
        </div>
      </div>

      <div class="game-area">
        <div class="top-bar">
          <div style="font-size: 0.7rem; color: #ccc">KEMENANGAN TUMBLE</div>
          <div
            id="win-display"
            style="font-size: 1.4rem; font-weight: bold; color: gold"
          >
            0
          </div>
        </div>
        <div class="slot-grid" id="grid"></div>
      </div>

      <div class="side-panel">
        <div id="zeus-anim">
          <div class="zeus-avatar">👴🏻</div>
          <div class="zeus-body"></div>
        </div>
      </div>
    </div>

    <div class="control-bar">
      <div class="info-group">
        <div class="label">SALDO (RP)</div>
        <div class="val-box">
          <span id="balance">100.000</span
          ><button class="btn-tiny btn-add" onclick="openTopUp()">+</button>
        </div>
      </div>
      <div class="info-group">
        <div class="label">TARUHAN</div>
        <div class="val-box">
          <button class="btn-tiny" onclick="changeBet(-200)">-</button
          ><span id="bet">200</span
          ><button class="btn-tiny" onclick="changeBet(200)">+</button>
        </div>
      </div>
      <div class="spin-button" id="spin-btn" onclick="spin()">⟳</div>
    </div>

    <div id="topup-modal" class="modal-overlay">
      <div class="modal-box" style="border-color: #0f0">
        <h3 style="color: #0f0">💸 ISI SALDO 💸</h3>
        <button class="modal-btn" onclick="addBalance(100000)">
          Rp 100.000
        </button>
        <button class="modal-btn" onclick="addBalance(1000000)">
          Rp 1.000.000
        </button>
        <input
          type="number"
          id="manual-input"
          style="
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #222;
            border: 1px solid #555;
            color: white;
          "
          placeholder="Manual Input..."
        />
        <button
          class="modal-btn"
          onclick="addManualBalance()"
          style="background: #00c853; color: black; font-weight: bold"
        >
          ISI MANUAL
        </button>
        <button
          class="modal-btn"
          onclick="closeModals()"
          style="background: #500"
        >
          Batal
        </button>
      </div>
    </div>

    <div id="admin-modal" class="modal-overlay">
      <div class="modal-box" style="border-color: red">
        <h3 style="color: red">⚙️ ADMIN SETTING</h3>
        <button class="modal-btn" onclick="setMode('NORMAL')">
          Normal (Acak)
        </button>
        <button class="modal-btn" onclick="setMode('MAXWIN')">
          ⚡ MAXWIN (Jackpot)
        </button>
        <button class="modal-btn" onclick="setMode('RUNGKAD')">
          💀 RUNGKAD (Kalah)
        </button>
        <div id="mode-display" style="color: yellow; margin: 10px">
          Mode: NORMAL
        </div>
        <button
          class="modal-btn"
          onclick="closeModals()"
          style="background: #333"
        >
          Tutup
        </button>
      </div>
    </div>

    <div class="admin-trigger" onclick="openAdmin()" title="Admin Setting">
      ⚙️
    </div>

    <script>
      const SYMBOLS = [
        { id: 0, char: "💎", val: 0.2, c: "sym-low" },
        { id: 1, char: "🟩", val: 0.4, c: "sym-low" },
        { id: 2, char: "🟡", val: 0.5, c: "sym-low" },
        { id: 3, char: "🔻", val: 0.8, c: "sym-low" },
        { id: 4, char: "❤️", val: 1.0, c: "sym-high" },
        { id: 5, char: "🏆", val: 1.5, c: "sym-high" },
        { id: 6, char: "💍", val: 2.0, c: "sym-high" },
        { id: 7, char: "⏳", val: 5.0, c: "sym-high" },
        { id: 8, char: "👑", val: 50.0, c: "sym-high" },
      ];

      let balance =50000;
      let bet = 200;
      let isSpinning = false;
      let grid = [];
      let nextMode = "NORMAL";

      const audio = {
        spin: new Audio("sounds/spin.mp3"),
        win: new Audio("sounds/win.mp3"),
        lose: new Audio("sounds/lose.mp3"),
        topup: new Audio("sounds/topup.mp3"),
      };
      audio.spin.volume = 0.4;

      function init() {
        updateUI();
        fillGrid(false);
        renderGrid(false);
      }

      function fillGrid(allowMult) {
        grid = [];
        for (let c = 0; c < 6; c++) {
          let col = [];
          for (let r = 0; r < 5; r++) col.push(getRandomSym(allowMult));
          grid.push(col);
        }
      }

      function getRandomSym(allowMult) {
        if (nextMode === "MAXWIN") {
          if (Math.random() > 0.6) return SYMBOLS[8];
          if (allowMult && Math.random() > 0.8) return createMult(500);
        }
        if (nextMode === "RUNGKAD")
          return SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];

        let rand = Math.random() * 100;
        if (allowMult && rand > 96) return createMult(0);

        if (rand < 16) return SYMBOLS[0];
        if (rand < 29) return SYMBOLS[1];
        if (rand < 41) return SYMBOLS[2];
        if (rand < 52) return SYMBOLS[3];
        if (rand < 62) return SYMBOLS[4];
        if (rand < 71) return SYMBOLS[5];
        if (rand < 79) return SYMBOLS[6];
        if (rand < 86) return SYMBOLS[7];
        return SYMBOLS[8];
      }

      function createMult(forceVal) {
        const vals = [2, 5, 10, 25, 50, 100, 500];
        let val =
          forceVal > 0
            ? forceVal
            : vals[Math.floor(Math.random() * vals.length)];
        let css = "orb-green";
        if (val >= 10) css = "orb-purple";
        if (val >= 100) css = "orb-red";
        return { type: "mult", val: val, char: val + "x", css: css };
      }

      // Render dengan opsi animasi drop (class 'anim-drop')
      function renderGrid(animateDrop = true, specificCoords = []) {
        const el = document.getElementById("grid");
        el.innerHTML = "";
        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 6; c++) {
            let cell = document.createElement("div");
            cell.className = "grid-cell";
            cell.id = `c-${c}-${r}`;

            // Kalau animateDrop true, semua dikasih animasi jatuh
            // Kalau specificCoords ada, cek apakah koordinat ini yang harus jatuh
            if (animateDrop) {
              cell.classList.add("anim-drop");
            }

            let s = grid[c][r];
            if (s) {
              if (s.type === "mult") {
                cell.innerHTML = `<div class="multiplier-orb ${s.css}">${s.char}</div>`;
              } else {
                cell.innerText = s.char;
                if (s.val >= 1) cell.style.textShadow = "0 0 5px gold";
              }
            }
            el.appendChild(cell);
          }
        }
      }

      function spin() {
        if (isSpinning || balance < bet) {
          if (balance < bet) openTopUp();
          return;
        }

        balance -= bet;
        updateUI();
        isSpinning = true;
        document.getElementById("spin-btn").classList.add("spin-disabled");
        let wd = document.getElementById("win-display");
        wd.innerText = "MEMUTAR...";
        wd.style.color = "white";

        playSound("spin");

        // Visual Shuffle
        let shuffleCount = 0;
        let spinInterval = setInterval(() => {
          let tempGrid = [];
          for (let c = 0; c < 6; c++) {
            let col = [];
            for (let r = 0; r < 5; r++)
              col.push(SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
            tempGrid.push(col);
          }
          const el = document.getElementById("grid");
          el.innerHTML = "";
          for (let r = 0; r < 5; r++) {
            for (let c = 0; c < 6; c++) {
              let cell = document.createElement("div");
              cell.className = "grid-cell";
              let s = tempGrid[c][r];
              cell.innerText = s.char;
              el.appendChild(cell);
            }
          }
          shuffleCount++;
          if (shuffleCount >= 70) {
            clearInterval(spinInterval);
            finalizeSpin();
          }
        }, 100);

        if (Math.random() < 0.3 || nextMode === "MAXWIN") triggerZeus();
      }

      function finalizeSpin() {
        fillGrid(true);
        renderGrid(true); // Drop animation saat berhenti
        processWin(0);
      }

      function processWin(currentWin) {
        let counts = {};
        let winCoords = [];

        for (let c = 0; c < 6; c++) {
          for (let r = 0; r < 5; r++) {
            let s = grid[c][r];
            if (!s || s.type === "mult") continue;
            if (!counts[s.id]) counts[s.id] = { n: 0, pos: [] };
            counts[s.id].n++;
            counts[s.id].pos.push({ c: c, r: r });
          }
        }

        let hasWin = false;
        let roundPay = 0;
        for (let id in counts) {
          if (counts[id].n >= 8) {
            hasWin = true;
            let sym = SYMBOLS.find((x) => x.id == id);
            roundPay += Math.floor(sym.val * counts[id].n * (bet / 5));
            winCoords.push(...counts[id].pos);
          }
        }

        if (hasWin) {
          currentWin += roundPay;
          let wd = document.getElementById("win-display");
          wd.innerText = "Rp " + currentWin.toLocaleString();
          wd.style.color = "gold";
          playSound("win");

          // 1. HIGHLIGHT (KEDIP)
          winCoords.forEach((p) => {
            let cell = document.getElementById(`c-${p.c}-${p.r}`);
            if (cell) {
              cell.classList.remove("anim-drop");
              cell.classList.add("anim-win-border");
            }
          });

          // 2. PECAH SATU PER SATU (CASCADE)
          setTimeout(() => {
            let delay = 0;
            winCoords.forEach((p, index) => {
              setTimeout(() => {
                let cell = document.getElementById(`c-${p.c}-${p.r}`);
                if (cell) cell.classList.add("anim-explode");
              }, delay);
              delay += 50; // Delay antar ledakan (biar kayak celetuk-celetuk)
            });

            // 3. SETELAH SEMUA PECAH -> RUNTUH
            setTimeout(() => {
              winCoords.forEach((p) => (grid[p.c][p.r] = null));
              gravity();
              refill();
              renderGrid(true); // Semua jatuh lagi
              processWin(currentWin);
            }, delay + 400); // Tunggu ledakan selesai
          }, 500); // Tunggu highlight selesai
        } else {
          finishRound(currentWin);
        }
      }

      function finishRound(totalWin) {
        let totalMult = 0;
        for (let c = 0; c < 6; c++) {
          for (let r = 0; r < 5; r++) {
            if (grid[c][r] && grid[c][r].type === "mult")
              totalMult += grid[c][r].val;
          }
        }

        let wd = document.getElementById("win-display");

        if (totalWin > 0 && totalMult > 0) {
          triggerZeus();
          setTimeout(() => {
            let finalPay = totalWin * totalMult;
            wd.innerHTML = `Rp ${totalWin.toLocaleString()} x <span style="color:red; font-size:1.5em">${totalMult}x</span>`;
            playSound("win");
            balance += finalPay;
            setTimeout(() => {
              wd.innerText = "TOTAL: Rp " + finalPay.toLocaleString();
              wd.style.color = "#0f0";
              updateUI();
              endSpin();
            }, 1000);
          }, 500);
        } else if (totalWin > 0) {
          balance += totalWin;
          wd.innerText = "MENANG: Rp " + totalWin.toLocaleString();
          wd.style.color = "gold";
          updateUI();
          endSpin();
        } else {
          wd.innerText = "RUNGKAD BOS!";
          wd.style.color = "red";
          playSound("lose");
          updateUI();
          endSpin();
        }
      }

      function endSpin() {
        isSpinning = false;
        document.getElementById("spin-btn").classList.remove("spin-disabled");
      }

      function gravity() {
        for (let c = 0; c < 6; c++) {
          let newCol = grid[c].filter((s) => s !== null);
          let diff = 5 - newCol.length;
          for (let i = 0; i < diff; i++) newCol.unshift(null);
          grid[c] = newCol;
        }
      }
      function refill() {
        for (let c = 0; c < 6; c++) {
          for (let r = 0; r < 5; r++) {
            if (grid[c][r] === null) grid[c][r] = getRandomSym(true);
          }
        }
      }

      function updateUI() {
        document.getElementById("balance").innerText =
          balance.toLocaleString("id-ID");
        document.getElementById("bet").innerText = bet.toLocaleString("id-ID");
      }

      function openTopUp() {
        document.getElementById("topup-modal").style.display = "flex";
        document.getElementById("manual-input").value = "";
      }

      function addBalance(amount) {
        balance += amount;
        updateUI();
        closeModals();
        if (audio.topup) {
          playSound("topup");
        } else {
          playSound("win");
        }
        alert(`✅ Deposit Rp ${amount.toLocaleString()} Berhasil!`);
      }

      function addManualBalance() {
        const input = document.getElementById("manual-input");
        const val = parseInt(input.value);
        if (!val || val <= 0) return alert("Masukkan nominal!");
        addBalance(val);
      }

      function changeBet(val) {
        if (isSpinning) return;
        let newBet = bet + val;
        if (newBet >= 200) bet = newBet;
        updateUI();
      }

      function openAdmin() {
        document.getElementById("admin-modal").style.display = "flex";
      }
      function setMode(mode) {
        nextMode = mode;
        document.getElementById("mode-display").innerText = "Mode: " + mode;
        alert("⚡ MODE AKTIF: " + mode);
        closeModals();
      }

      function closeModals() {
        document
          .querySelectorAll(".modal-overlay")
          .forEach((el) => (el.style.display = "none"));
      }

      function triggerZeus() {
        document.getElementById("zeus-anim").classList.add("zeus-strike");
        setTimeout(
          () =>
            document
              .getElementById("zeus-anim")
              .classList.remove("zeus-strike"),
          500
        );
      }

      function playSound(name) {
        try {
          if (audio[name]) {
            audio[name].currentTime = 0;
            audio[name].play().catch((e) => console.log("Sound error:", e));
          }
        } catch (e) {}
      }

      init();
    </script>
  </body>
</html>
