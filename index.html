<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Olympus Gate - Demo System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-container">
        <div class="game-container">
        <canvas id="effect-canvas"></canvas>
      <div class="header">
        <h1 class="logo-text">NGANU 888</h1>
        <div class="tagline">PROVABLY FAIR SYSTEM</div>
      </div>

      <div class="slot-window">
        <div class="payline"></div>

        <div class="reel-col"><div class="reel-strip" id="reel1"></div></div>
        <div class="reel-col"><div class="reel-strip" id="reel2"></div></div>
        <div class="reel-col"><div class="reel-strip" id="reel3"></div></div>
      </div>

      <div class="control-panel">
        <div class="info-bar-grid">
          <div class="stat-box">
            <div class="stat-label">DOMPET (RP)</div>
            <div class="stat-value-container">
              <span id="balance-display">0</span>
              
            </div>
          </div>

          <div class="stat-box">
            <div class="stat-label">TARUHAN</div>
            <div class="stat-value-container">
              <button class="btn-mini" onclick="adjustBet(-5000)">➖</button>
              <span id="bet-display">0</span>
              <button class="btn-mini" onclick="adjustBet(5000)">➕</button>
              <button
                class="btn-mini btn-topup"
                onclick="openDepositModal()"
                title="Menu Deposit"
              >
                + 💰
              </button>
            </div>
          </div>
        </div>

        <div class="spin-btn-container">
          <button class="spin-btn" id="spin-btn">PUTAR</button>
        </div>

        <div id="status-msg">Tentukan taruhanmu...</div>
      </div>

      <div class="footer-info">
        Server ID: HG-8821-X
        <span id="admin-trigger" onclick="toggleAdmin()">.</span>
      </div>
    </div>

    <div id="admin-modal" class="admin-modal">
      <div class="admin-content">
        <h3>⚠️ BANDAR CONTROL ⚠️</h3>
        <p>Atur hasil putaran berikutnya secara manual:</p>

        <div class="admin-buttons">
          <button onclick="setOverride('win')" class="btn-win">
            FORCE WIN
          </button>
          <button onclick="setOverride('jackpot')" class="btn-jackpot">
            FORCE JACKPOT
          </button>
          <button onclick="setOverride('near-miss')" class="btn-near">
            NEAR MISS
          </button>
          <button onclick="setOverride('loss')" class="btn-lose">
            FORCE LOSE
          </button>
        </div>

        <div class="admin-status">
          Next: <span id="override-status">Auto (Skenario)</span>
        </div>
        <button onclick="toggleAdmin()" class="btn-close">Tutup Panel</button>
      </div>
    </div>
    <div id="deposit-modal" class="admin-modal">
      <div
        class="admin-content"
        style="border-color: #00ff00; box-shadow: 0 0 20px #00ff00"
      >
        <h3 style="color: #00ff00">💸 ISI SALDO 💸</h3>
        <p>Pilih metode pengisian:</p>

        <div
          style="
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
          "
        >
          <button onclick="processDeposit(50000)" class="btn-voucher">
            Rp 50.000
          </button>
          <button onclick="processDeposit(100000)" class="btn-voucher">
            Rp 100.000
          </button>
          <button onclick="processDeposit(500000)" class="btn-voucher">
            Rp 500.000
          </button>
          <button onclick="processDeposit(1000000)" class="btn-voucher">
            Rp 1.000.000
          </button>
        </div>

        <hr style="border-color: #333; margin: 15px 0" />

        <p style="font-size: 0.9rem; color: #ccc">
          Atau Input Manual (Suka-suka):
        </p>
        <div style="display: flex; gap: 5px; justify-content: center">
          <input
            type="number"
            id="manual-amount"
            placeholder="Contoh: 999999"
            style="
              padding: 10px;
              border-radius: 5px;
              border: 1px solid #555;
              background: #000;
              color: white;
              width: 60%;
            "
          />
          <button
            onclick="processManualDeposit()"
            style="
              background: #00ff00;
              color: black;
              border: none;
              border-radius: 5px;
              font-weight: bold;
              cursor: pointer;
            "
          >
            ISI
          </button>
        </div>

        <button
          onclick="closeDepositModal()"
          class="btn-close"
          style="margin-top: 20px"
        >
          Batal
        </button>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="game.js"></script>
  </body>
</html
