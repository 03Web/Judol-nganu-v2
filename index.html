<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Gates of Nganu - Edukasi Simulasi</title>
    <style>
      /* --- CSS: GLOBAL & DESKTOP --- */
      @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Roboto:wght@500&display=swap");

      :root {
        --gold: #ffd700;
        --gold-glow: #ffeb3b;
        --bg-dark: #2a0a38;
      }
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        color: white;
        font-family: "Roboto", sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .world-bg {
        position: absolute;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, #4a1060 0%, #150020 80%);
        z-index: -1;
      }

      /* Container Utama */
      .main-interface {
        display: flex;
        width: 98%;
        max-width: 1200px;
        height: 90vh;
        gap: 10px;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .side-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .logo-area h1 {
        font-family: "Cinzel", serif;
        font-size: 1.8rem;
        text-align: center;
        text-shadow: 0 0 10px var(--gold);
        line-height: 1.2;
        margin: 0;
      }
      .highlight {
        color: var(--gold);
        font-size: 2.2rem;
      }

      /* ZEUS */
      .zeus-wrapper {
        position: relative;
        display: flex;
        justify-content: center;
      }
      .zeus-avatar {
        width: 140px;
        height: 140px;
        background: radial-gradient(circle at 30% 30%, #fff, #e0e0e0);
        border-radius: 50%;
        border: 4px solid var(--gold);
        box-shadow: 0 0 30px var(--gold-glow);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 4rem;
        position: relative;
        z-index: 2;
        transition: transform 0.2s;
      }
      .zeus-body {
        width: 100px;
        height: 80px;
        background: linear-gradient(to bottom, #fff, #bbb);
        border-radius: 40% 40% 0 0;
        margin-top: -20px;
        z-index: 1;
        opacity: 0.8;
      }
      .zeus-strike .zeus-avatar {
        box-shadow: 0 0 50px cyan, 0 0 80px white;
        animation: shakeZeus 0.5s ease-in-out;
        filter: brightness(1.5);
      }
      @keyframes shakeZeus {
        0% {
          transform: translateX(0) rotate(0);
        }
        25% {
          transform: translateX(-15px) rotate(-10deg);
        }
        75% {
          transform: translateX(15px) rotate(10deg);
        }
        100% {
          transform: translateX(0) rotate(0);
        }
      }

      /* GAME AREA */
      .game-area {
        flex: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 600px;
        z-index: 10;
      }

      .top-bar {
        background: rgba(0, 0, 0, 0.6);
        padding: 5px 20px;
        border-radius: 10px;
        border: 1px solid var(--gold);
        text-align: center;
        margin-bottom: 10px;
        min-width: 200px;
        box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
      }

      .slot-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        grid-template-rows: repeat(5, 1fr);
        gap: 5px;
        width: 100%;
        aspect-ratio: 6/5;
        background: rgba(0, 0, 0, 0.6);
        border: 4px solid var(--gold);
        border-radius: 15px;
        padding: 8px;
        box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        position: relative;
      }

      .grid-cell {
        background: linear-gradient(145deg, #2b1d36, #1a0f24);
        border: 1px solid #4a3b5a;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.8rem;
        position: relative;
        transform: scale(1);
        transition: transform 0.1s, filter 0.1s;
      }

      /* --- ANIMASI BARU YANG LEBIH SMOOTH --- */

      /* Animasi Drop (Staggered) */
      .anim-drop {
        animation: bounceIn 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275)
          backwards;
      }

      @keyframes bounceIn {
        0% {
          opacity: 0;
          transform: translateY(-400px);
        }
        60% {
          opacity: 1;
          transform: translateY(20px);
        }
        100% {
          transform: translateY(0);
        }
      }

      /* Animasi Highlight Menang (Kedip Cepat) */
      .anim-win-border {
        border: 2px solid white !important;
        box-shadow: inset 0 0 20px gold, 0 0 15px white;
        z-index: 5;
        animation: pulseWinner 0.3s infinite alternate;
      }
      @keyframes pulseWinner {
        0% {
          transform: scale(1);
          filter: brightness(1);
        }
        100% {
          transform: scale(1.05);
          filter: brightness(1.3);
        }
      }

      /* Animasi Pecah (Explode) */
      .anim-explode {
        animation: popOut 0.5s forwards ease-in;
      }
      @keyframes popOut {
        0% {
          transform: scale(1.1);
          opacity: 1;
        }
        50% {
          transform: scale(1.3);
          opacity: 0.8;
          filter: contrast(200%);
        }
        100% {
          transform: scale(0);
          opacity: 0;
        }
      }

      /* Multiplier Orb Spin */
      .multiplier-orb {
        border-radius: 50%;
        width: 85%;
        height: 85%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: 900;
        font-size: 0.9rem;
        color: white;
        border: 2px solid white;
        box-shadow: 0 0 10px currentColor;
        animation: spinOrb 3s infinite linear;
      }
      @keyframes spinOrb {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .orb-green {
        background: #00c853;
        color: #b9f6ca;
      }
      .orb-purple {
        background: #aa00ff;
        color: #ea80fc;
      }
      .orb-red {
        background: #d50000;
        color: #ff8a80;
      }

      /* CONTROL BAR */
      .control-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.95);
        border-top: 2px solid #333;
        padding: 10px 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 100;
      }
      .info-group {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .label {
        font-size: 0.7rem;
        color: #aaa;
      }
      .val-box {
        display: flex;
        align-items: center;
        gap: 8px;
        color: white;
        font-weight: bold;
        font-family: monospace;
        font-size: 1.1rem;
      }
      .btn-tiny {
        background: #333;
        border: 1px solid #555;
        color: white;
        width: 30px;
        height: 30px;
        border-radius: 5px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
      }
      .btn-add {
        background: #1b5e20;
        border-color: #2e7d32;
      }
      .spin-button {
        background: radial-gradient(circle, #ffeb3b, #f57f17);
        width: 75px;
        height: 75px;
        border-radius: 50%;
        border: 4px solid #fff59d;
        font-size: 1.8rem;
        font-weight: 900;
        color: #3e2723;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        transition: transform 0.1s;
      }
      .spin-button:active {
        transform: scale(0.9);
      }
      .spin-disabled {
        filter: grayscale(1);
        cursor: not-allowed;
        animation: none;
      }

      /* --- BIG WIN MODAL (NEW) --- */
      .big-win-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        z-index: 999;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        animation: fadeIn 0.5s;
      }
      .big-win-text {
        font-family: "Cinzel", serif;
        font-size: 3.5rem;
        color: #ffd700;
        text-transform: uppercase;
        text-shadow: 0 0 20px red, 0 0 50px orange;
        animation: zoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .big-win-amount {
        font-family: "Roboto", sans-serif;
        font-size: 3rem;
        font-weight: 900;
        color: white;
        margin-top: 20px;
        text-shadow: 0 0 10px #00e676;
      }
      @keyframes zoomIn {
        0% {
          transform: scale(0);
          opacity: 0;
        }
        80% {
          transform: scale(1.1);
          opacity: 1;
        }
        100% {
          transform: scale(1);
        }
      }

      /* MODALS (OLD) */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        z-index: 200;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(5px);
      }
      .modal-box {
        background: #1a0000;
        border: 2px solid var(--gold);
        padding: 20px;
        border-radius: 15px;
        width: 90%;
        max-width: 320px;
        text-align: center;
        color: white;
      }
      .modal-btn {
        background: #333;
        color: white;
        padding: 12px;
        margin: 5px 0;
        border: 1px solid #555;
        cursor: pointer;
        width: 100%;
        border-radius: 8px;
        font-weight: bold;
      }
      .admin-trigger {
        position: fixed;
        bottom: 100px;
        right: 20px;
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.3);
        width: 35px;
        height: 35px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        cursor: pointer;
        border: 1px dashed #555;
        z-index: 99;
      }

      /* MOBILE OPTIMIZATION */
      @media (max-width: 768px) {
        .main-interface {
          flex-direction: column;
          justify-content: flex-start;
          padding-top: 10px;
          height: 100vh;
        }
        .side-panel {
          flex: none;
          width: 100%;
          flex-direction: row;
          justify-content: space-between;
          padding: 0 15px;
          margin-bottom: 5px;
        }
        .logo-area h1 {
          font-size: 1.2rem;
          text-align: left;
        }
        .highlight {
          font-size: 1.5rem;
        }
        .side-panel:last-child {
          position: absolute;
          top: 10px;
          right: 10px;
          width: auto;
          pointer-events: none;
        }
        .zeus-avatar {
          width: 70px;
          height: 70px;
          font-size: 2.5rem;
          border-width: 2px;
        }
        .zeus-body {
          display: none;
        }
        .game-area {
          width: 100%;
          margin-top: 40px;
        }
        .slot-grid {
          width: 95vw;
          max-width: 400px;
          gap: 3px;
        }
        .grid-cell {
          font-size: 1.4rem;
          border-radius: 5px;
        }
        .control-bar {
          padding: 10px 10px 20px 10px;
        }
        .val-box {
          font-size: 1rem;
        }
        .btn-tiny {
          width: 35px;
          height: 35px;
        }
        .big-win-text {
          font-size: 2.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="world-bg"></div>

    <div class="main-interface">
      <div class="side-panel">
        <div class="logo-area">
          <h1>JUDOL OF<br /><span class="highlight">NGANU</span></h1>
        </div>
      </div>

      <div class="game-area">
        <div class="top-bar">
          <div style="font-size: 0.7rem; color: #ccc">KEMENANGAN TUMBLE</div>
          <div
            id="win-display"
            style="font-size: 1.4rem; font-weight: bold; color: gold"
          >
            0
          </div>
        </div>
        <div class="slot-grid" id="grid"></div>
      </div>

      <div class="side-panel">
        <div class="zeus-wrapper" id="zeus-anim">
          <div class="zeus-avatar">👴🏻</div>
          <div class="zeus-body"></div>
        </div>
      </div>
    </div>

    <div id="big-win-modal" class="big-win-overlay" onclick="closeBigWin()">
      <div class="big-win-text" id="win-title">SENSATIONAL</div>
      <div class="big-win-amount" id="win-amount-text">Rp 0</div>
      <div style="color: #aaa; margin-top: 10px; font-size: 0.8rem">
        (Ketuk untuk lanjut)
      </div>
    </div>

    <div class="control-bar">
      <div class="info-group">
        <div class="label">SALDO</div>
        <div class="val-box">
          <span id="balance">100.000</span>
          <button class="btn-tiny btn-add" onclick="openTopUp()">+</button>
        </div>
      </div>

      <div id="bet-modal" class="modal-overlay">
        <div class="modal-box" style="border-color: gold">
          <h3 style="color: gold">GANTI TARUHAN</h3>
          <input
            type="number"
            id="manual-bet-input"
            style="
              width: 100%;
              padding: 10px;
              margin: 10px 0;
              background: #222;
              border: 1px solid #555;
              color: white;
              border-radius: 5px;
            "
            placeholder="Jumlah Taruhan..."
          />
          <button
            class="modal-btn"
            onclick="setManualBet()"
            style="background: gold; color: black; font-weight: bold"
          >
            SET TARUHAN
          </button>
          <button
            class="modal-btn"
            onclick="closeModals()"
            style="background: #555"
          >
            Batal
          </button>
        </div>
      </div>

      <div class="info-group">
        <div class="label">TARUHAN</div>
        <div class="val-box">
          <button class="btn-tiny" onclick="changeBet(-200)">-</button>
          <span id="bet">200</span>
          <button class="btn-tiny" onclick="changeBet(200)">+</button>
          <button
            class="btn-tiny"
            onclick="openBetModal()"
            style="background: #444; margin-left: 5px"
          >
            ✎
          </button>
        </div>
      </div>
      <div class="spin-button" id="spin-btn" onclick="spin()">⟳</div>
    </div>

    <div id="topup-modal" class="modal-overlay">
      <div class="modal-box" style="border-color: #0f0">
        <h3 style="color: #0f0">💸 ISI SALDO</h3>
        <button class="modal-btn" onclick="addBalance(100000)">
          Rp 100.000
        </button>
        <button class="modal-btn" onclick="addBalance(1000000)">
          Rp 1.000.000
        </button>
        <input
          type="number"
          id="manual-input"
          style="
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #222;
            border: 1px solid #555;
            color: white;
            border-radius: 5px;
          "
          placeholder="Input Manual..."
        />
        <button
          class="modal-btn"
          onclick="addManualBalance()"
          style="background: #00c853; color: black"
        >
          ISI MANUAL
        </button>
        <button
          class="modal-btn"
          onclick="closeModals()"
          style="background: #555"
        >
          Batal
        </button>
      </div>
    </div>

    <div id="admin-modal" class="modal-overlay">
      <div class="modal-box" style="border-color: red">
        <h3 style="color: red">⚙️ ADMIN MENU</h3>
        <button class="modal-btn" onclick="setMode('NORMAL')">
          Normal (Acak)
        </button>
        <button class="modal-btn" onclick="setMode('MAXWIN')">
          ⚡ MAXWIN (Gacor)
        </button>
        <button class="modal-btn" onclick="setMode('RUNGKAD')">
          💀 RUNGKAD (Sedot)
        </button>
        <div id="mode-display" style="color: yellow; margin: 10px">
          Mode: NORMAL
        </div>
        <button
          class="modal-btn"
          onclick="closeModals()"
          style="background: #333"
        >
          Tutup
        </button>
      </div>
    </div>

    <div class="admin-trigger" onclick="openAdmin()">⚙️</div>

    <script>
      const SYMBOLS = [
        { id: 0, char: "💎", val: 0.25, color: "#00e5ff" },
        { id: 1, char: "🟩", val: 0.4, color: "#00c853" },
        { id: 2, char: "🟡", val: 0.5, color: "#ffd600" },
        { id: 3, char: "🔻", val: 0.8, color: "#aa00ff" },
        { id: 4, char: "❤️", val: 1.0, color: "#ff1744" },
        { id: 5, char: "🏆", val: 1.5, color: "#ffd700" },
        { id: 6, char: "💍", val: 2.0, color: "#00b0ff" },
        { id: 7, char: "⏳", val: 5.0, color: "#ff9100" },
        { id: 8, char: "👑", val: 20.0, color: "#d50000" }, // Crown mahal
      ];

      let balance = 5000;
      let bet = 200;
      let isSpinning = false;
      let grid = [];
      let nextMode = "NORMAL";
      let tumbleWin = 0;

      const audio = {
        spin: new Audio("sounds/spin.mp3"),
        win: new Audio("sounds/win.mp3"),
        lose: new Audio("sounds/lose.mp3"),
        topup: new Audio("sounds/topup.mp3"),
      };
      // Setup Audio
      Object.values(audio).forEach((a) => (a.volume = 0.5));

      function init() {
        updateUI();
        fillGrid(false);
        renderGrid(false);
      }

      // Logic Grid
      function fillGrid(allowMult) {
        grid = [];
        for (let c = 0; c < 6; c++) {
          let col = [];
          for (let r = 0; r < 5; r++) col.push(getRandomSym(allowMult));
          grid.push(col);
        }
      }

      function getRandomSym(allowMult) {
        // Admin manipulation
        if (nextMode === "MAXWIN") {
          // Chance gede simbol mahal & multiplier
          if (Math.random() > 0.6) return SYMBOLS[8]; // Crown
          if (allowMult && Math.random() > 0.7) return createMult(100);
        }
        if (nextMode === "RUNGKAD") {
          // Gak pernah kasih multiplier
          return SYMBOLS[Math.floor(Math.random() * 5)]; // Simbol murah doang
        }

        // Normal RNG
        let rand = Math.random() * 100;
        if (allowMult && rand > 97) return createMult(0); // 3% chance multiplier

        if (rand < 18) return SYMBOLS[0];
        if (rand < 34) return SYMBOLS[1];
        if (rand < 48) return SYMBOLS[2];
        if (rand < 60) return SYMBOLS[3];
        if (rand < 70) return SYMBOLS[4];
        if (rand < 79) return SYMBOLS[5];
        if (rand < 87) return SYMBOLS[6];
        if (rand < 94) return SYMBOLS[7];
        return SYMBOLS[8];
      }

      function createMult(forceVal) {
        const vals = [2, 3, 5, 8, 10, 15, 25, 50, 100, 500];
        let val =
          forceVal > 0
            ? forceVal
            : vals[Math.floor(Math.random() * vals.length)];
        let css = "orb-green";
        if (val >= 10) css = "orb-purple";
        if (val >= 100) css = "orb-red";
        return { type: "mult", val: val, char: val + "x", css: css };
      }

      // --- RENDER DENGAN ANIMASI STAGGERED ---
      function renderGrid(animateDrop = true) {
        const el = document.getElementById("grid");
        el.innerHTML = "";

        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 6; c++) {
            let cell = document.createElement("div");
            cell.className = "grid-cell";
            cell.id = `c-${c}-${r}`;

            let s = grid[c][r];
            if (s) {
              if (animateDrop) {
                cell.classList.add("anim-drop");
                // UBAH DISINI: Angka diperbesar (100 & 50) biar turunnya gantian pelan-pelan
                let delay = c * 100 + r * 50;
                cell.style.animationDelay = `${delay}ms`;
              }

              if (s.type === "mult") {
                cell.innerHTML = `<div class="multiplier-orb ${s.css}">${s.char}</div>`;
              } else {
                cell.innerText = s.char;
                cell.style.color = s.color;
                cell.style.textShadow = `0 0 10px ${s.color}`;
              }
            }
            el.appendChild(cell);
          }
        }
      }

      function spin() {
        // 1. Cek Saldo & Status
        if (isSpinning || balance < bet) {
          if (balance < bet) openTopUp();
          return;
        }

        balance -= bet;
        updateUI();
        isSpinning = true;
        tumbleWin = 0;

        document.getElementById("spin-btn").classList.add("spin-disabled");
        document.getElementById("win-display").innerText = "MEMUTAR...";

        playSound("spin");

        if (Math.random() < 0.4 || nextMode === "MAXWIN") triggerZeus();

        // 2. EFEK "PENGOCOKAN" (Shuffle Animation)
        // Ini mengembalikan efek simbol berubah-ubah secara acak
        const el = document.getElementById("grid");
        let shuffleCount = 0;

        let spinInterval = setInterval(() => {
          el.innerHTML = ""; // Bersihkan grid visual

          // Loop buat bikin tampilan simbol acak sementara
          for (let r = 0; r < 5; r++) {
            for (let c = 0; c < 6; c++) {
              let cell = document.createElement("div");
              cell.className = "grid-cell";
              // Catatan: Kita TIDAK pakai class 'anim-drop' disini biar gak berat

              // Ambil simbol sembarang untuk efek visual saja
              let randSym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];

              cell.innerText = randSym.char;
              cell.style.color = randSym.color;
              cell.style.opacity = "0.7"; // Agak transparan biar kesan bergerak cepat

              el.appendChild(cell);
            }
          }

          shuffleCount++;

          // 3. STOP PENGOCOKAN & TAMPILKAN HASIL AKHIR
          // Angka 20 berarti ngocok selama 2 detik (20 x 100ms)
          if (shuffleCount >= 20) {
            clearInterval(spinInterval);

            el.innerHTML = ""; // Hapus simbol acak tadi

            // Panggil logika hasil asli & animasi Drop Air Terjun
            fillGrid(true);
            renderGrid(true);

            // Tunggu animasi drop selesai (2 detik) baru hitung kemenangan
            setTimeout(() => {
              processWin(0);
            }, 2000);
          }
        }, 100); // Kecepatan ganti simbol (0.1 detik)
      }

      function processWin(currentAccumulatedWin) {
        // 1. Hitung Simbol & Kemenangan (Bagian ini wajib ada)
        let counts = {};
        let winCoords = [];

        for (let c = 0; c < 6; c++) {
          for (let r = 0; r < 5; r++) {
            let s = grid[c][r];
            if (!s || s.type === "mult") continue;
            if (!counts[s.id]) counts[s.id] = { n: 0, pos: [] };
            counts[s.id].n++;
            counts[s.id].pos.push({ c: c, r: r });
          }
        }

        let hasWin = false;
        let roundPay = 0;

        // Filter kemenangan > 8 simbol
        for (let id in counts) {
          if (counts[id].n >= 8) {
            hasWin = true;
            let sym = SYMBOLS.find((x) => x.id == id);
            let pay = sym.val * (bet / 2);
            if (counts[id].n > 9) pay *= 1.5;
            if (counts[id].n > 11) pay *= 2;

            roundPay += Math.floor(pay);
            winCoords.push(...counts[id].pos);
          }
        }

        // 2. Eksekusi Animasi (Bagian yang diedit tadi)
        if (hasWin) {
          // Update total kemenangan sementara
          let totalNow = currentAccumulatedWin + roundPay; // Ganti nama variabel biar aman

          let wd = document.getElementById("win-display");
          wd.innerText = "Rp " + totalNow.toLocaleString();
          wd.style.color = "gold";
          wd.style.textShadow = "0 0 10px red";

          playSound("win");

          // Tahap A: Highlight Border (Nyala dulu)
          winCoords.forEach((p) => {
            let cell = document.getElementById(`c-${p.c}-${p.r}`);
            if (cell) {
              cell.classList.remove("anim-drop");
              cell.classList.add("anim-win-border");
            }
          });

          // Tahap B: Pecah Satu-Satu (Combo Effect)
          let startDelay = 800; // Tunggu 0.8 detik buat liat hasil
          let popSpeed = 300; // Jeda 0.3 detik tiap simbol pecah

          // Acak urutan pecah
          winCoords.sort(() => Math.random() - 0.5);

          winCoords.forEach((p, index) => {
            setTimeout(() => {
              let cell = document.getElementById(`c-${p.c}-${p.r}`);
              if (cell) {
                cell.classList.remove("anim-win-border");
                cell.classList.add("anim-explode");
              }
            }, startDelay + index * popSpeed);
          });

          // Tahap C: Lanjut Ronde Berikutnya
          let totalWait = startDelay + winCoords.length * popSpeed + 500;

          setTimeout(() => {
            // Hapus data di array grid
            winCoords.forEach((p) => (grid[p.c][p.r] = null));

            gravity();
            refill();
            renderGrid(true); // Simbol baru turun

            // Cek lagi (Rekursif) dengan nilai kemenangan yang baru
            setTimeout(() => processWin(totalNow), 1500);
          }, totalWait);
        } else {
          // Kalau tidak ada kemenangan, selesai
          finishRound(currentAccumulatedWin);
        }
      }

      function gravity() {
        for (let c = 0; c < 6; c++) {
          let newCol = grid[c].filter((s) => s !== null);
          let diff = 5 - newCol.length;
          for (let i = 0; i < diff; i++) newCol.unshift(null);
          grid[c] = newCol;
        }
      }

      function refill() {
        for (let c = 0; c < 6; c++) {
          for (let r = 0; r < 5; r++) {
            if (grid[c][r] === null) grid[c][r] = getRandomSym(true);
          }
        }
      }

      function finishRound(totalWin) {
        let totalMult = 0;
        // Scan Multiplier di layar
        for (let c = 0; c < 6; c++) {
          for (let r = 0; r < 5; r++) {
            if (grid[c][r] && grid[c][r].type === "mult")
              totalMult += grid[c][r].val;
          }
        }

        if (totalWin > 0 && totalMult > 0) {
          // MENANG + MULTIPLIER
          triggerZeus(); // Kakek nyambar
          setTimeout(() => {
            let finalPay = totalWin * totalMult;
            let wd = document.getElementById("win-display");
            wd.innerHTML = `Rp ${totalWin.toLocaleString()} x <span style="color:red; font-size:1.5em">${totalMult}x</span>`;
            playSound("win"); // Harusnya suara petir

            setTimeout(() => {
              balance += finalPay;
              updateUI();
              // Tampilkan BIG WIN Notification
              showBigWin(finalPay, totalMult);
            }, 1000);
          }, 800);
        } else if (totalWin > 0) {
          // MENANG BIASA
          balance += totalWin;
          updateUI();
          endSpin();
        } else {
          // KALAH
          let wd = document.getElementById("win-display");
          wd.innerText = "RUNGKAD!";
          wd.style.color = "grey";
          playSound("lose");
          updateUI();
          endSpin();
        }
      }

      function showBigWin(amount, mult) {
        const modal = document.getElementById("big-win-modal");
        const title = document.getElementById("win-title");
        const amt = document.getElementById("win-amount-text");

        // Tentukan Judul Berdasarkan Kali
        if (mult >= 500) title.innerText = "MAX WIN ⚡";
        else if (mult >= 100) title.innerText = "SENSATIONAL";
        else if (mult >= 50) title.innerText = "MEGA WIN";
        else title.innerText = "BIG WIN";

        amt.innerText = "Rp " + amount.toLocaleString();

        modal.style.display = "flex";
        playSound("win"); // Play sound lagi biar heboh
      }

      function closeBigWin() {
        document.getElementById("big-win-modal").style.display = "none";
        endSpin();
      }

      function endSpin() {
        isSpinning = false;
        document.getElementById("spin-btn").classList.remove("spin-disabled");
      }

      // --- UTILITIES ---
      function updateUI() {
        document.getElementById("balance").innerText =
          balance.toLocaleString("id-ID");
        document.getElementById("bet").innerText = bet.toLocaleString("id-ID");
      }
      function openTopUp() {
        document.getElementById("topup-modal").style.display = "flex";
      }
      function addBalance(amount) {
        balance += amount;
        updateUI();
        closeModals();
        playSound("topup");
        alert(`✅ Deposit Rp ${amount.toLocaleString()} Berhasil!`);
      }
      function addManualBalance() {
        const val = parseInt(document.getElementById("manual-input").value);
        if (val > 0) addBalance(val);
      }
      function changeBet(val) {
        if (!isSpinning && bet + val >= 200) {
          bet += val;
          updateUI();
        }
      }
      function openAdmin() {
        document.getElementById("admin-modal").style.display = "flex";
      }
      function setMode(mode) {
        nextMode = mode;
        document.getElementById("mode-display").innerText = "Mode: " + mode;
        closeModals();
      }
      function closeModals() {
        document.querySelectorAll(".modal-overlay").forEach((el) => {
          if (el.id !== "big-win-modal") el.style.display = "none";
        });
      }
      function triggerZeus() {
        const z = document.getElementById("zeus-anim");
        z.classList.add("zeus-strike");
        setTimeout(() => z.classList.remove("zeus-strike"), 800);
      }
      function playSound(name) {
        if (audio[name]) {
          audio[name].currentTime = 0;
          audio[name].play().catch(() => {});
        }
      }
      function openBetModal() {
        document.getElementById("bet-modal").style.display = "flex";
      }
      function setManualBet() {
        const val = parseInt(document.getElementById("manual-bet-input").value);
        if (val > 0) {
          bet = val;
          updateUI();
          closeModals();
        }
      }

      init();
    </script>
  </body>
</html>
